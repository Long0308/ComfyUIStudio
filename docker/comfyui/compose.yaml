name: comfyui-studio
services:
  comfyui:
    build: .
    image: comfyui-studio:local
    container_name: Comfyui-Studio
    # User decision 2026-10-27 (T-E05): come back after a Docker Engine restart.
    restart: "unless-stopped"
    init: true
    gpus: all
    ports:
      - "127.0.0.1:8188:8188"
    shm_size: 2gb
    mem_limit: 28g
    stop_grace_period: 45s
    environment:
      COMFY_IDLE_SECONDS: "300"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - "../ComfyUI:/opt/ComfyUI:ro"
      - "../ComfyUI/input:/opt/ComfyUI/input"
      - "../ComfyUI/output:/opt/ComfyUI/output"
      - "../ComfyUI/user:/opt/ComfyUI/user"
      - "../ComfyUI/temp:/opt/ComfyUI/temp"
      # 2026-10-31 (bridge lane): host bridge state (secret + jobs) read-only for custom node codex_lane_bridge.
      - "../engine/bridge:/run/codex-bridge:ro"
      # 2026-10-29 drive move: models live in J:\2.Model-AI-Local\ComfyUI (provenance: ..\MODEL-CATALOG.md); read-only as before.
      # 2026-10-31 (user: "đổi model từ J sang C"): identical copy on C: NVMe (91 files / 184,620,371,739 bytes verified equal);
      #   measured container read 6.9 MB/s from J: (HDD) vs 347 MB/s from C:. J: copy kept untouched as source/backup.
      #   Rollback: restore the previous line below.
      # - "J:/2.Model-AI-Local/ComfyUI:/opt/ComfyUI/models:ro"
      - "C:/AI-Models-Fast/2.Model-AI-Local/ComfyUI:/opt/ComfyUI/models:ro"
    # Enable the ComfyUI image-reference picker; keep custom-node hardening and whitelist unchanged.
    # User decision 2026-10-27 (T-E10): --disable-partner-nodes keeps paid cloud API nodes (e.g. ClaudeNode) out of local inference.
    # 2026-10-31: + codex_lane_bridge (node CodexOAuthImageLane: cloud GPT via host `jjv bridge serve`, not local GPU;
    #   + same-origin proxy routes /codex_lane/*).
    # 2026-10-31: + newtecons_step_ui (frontend-only step tab bar + VÀO/RA panel; no nodes, no routes, read-only GETs).
    command: ["main.py", "--listen", "0.0.0.0", "--port", "8188", "--disable-auto-launch", "--reserve-vram", "2", "--enable-assets", "--disable-partner-nodes", "--disable-all-custom-nodes", "--whitelist-custom-nodes", "comfyui-krea2edit", "newtecons_live_preview", "newtecons_branding", "newtecons_step_ui", "codex_lane_bridge", "newtecons_project_panel"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

